name: Validate static workspace

on:
  push:
    branches: ["main", "feat/workspace-hardening-roadmap"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check enhancements.js
          node --check intelligence.js
          node --check autonomy.js
      - name: Verify required entry points
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s enhancements.js
          test -s intelligence.js
          test -s autonomy.js
          grep -q 'enhancements.js' index.html
      - name: Run intelligence and autonomy tests
        run: node --test tests/*.test.js
